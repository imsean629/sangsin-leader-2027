<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>2027 포춘쿠키 — 26/27년 경영검토회</title>

<meta property="og:title" content="2027 정미년 포춘쿠키 · 3개까지!">
<meta property="og:description" content="26/27년 경영검토회 · 쿠키를 톡톡 깨서 2027년 나의 운세를 꺼내 보세요.">
<meta property="og:url" content="https://imsean629.github.io/sangsin-leader-2027/fortune/">
<meta property="og:image" content="https://imsean629.github.io/sangsin-leader-2027/fortune/og.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gowun+Batang:wght@700&family=JetBrains+Mono:wght@700&display=swap">
<style>
:root{--red:#E60013;--deep:#6E000B;--blue:#004098;--navy:#0B1B36;--gold:#E8C35A;--cream:#FFF8EC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;background:#3A0006;color:#FFFFFF}
button{font-family:inherit}
[hidden]{display:none!important}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 30%,#B3001A 0%,#7A000E 55%,#46000A 100%);position:relative;overflow:hidden}
.bar{height:6px;display:flex}.bar i{display:block}.bar i:first-child{flex:7;background:var(--red)}.bar i:last-child{flex:3;background:var(--blue)}
.dots{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(232,195,90,.18) 1.2px,transparent 1.4px);background-size:22px 22px;mask-image:linear-gradient(180deg,#000,transparent 70%)}
.head{position:relative;padding:20px 22px 0;text-align:center}
.head small{font-size:12.5px;font-weight:700;color:#FFD9DC}
.head h1{margin:8px 0 0;font-family:'Gowun Batang',serif;font-size:34px;line-height:1.2;font-weight:700}
.head h1 em{font-style:normal;color:var(--gold)}
.head p{margin:8px 0 0;font-size:14.5px;color:#FFE3E5;line-height:1.55}
.slots{margin-top:14px;display:flex;justify-content:center;gap:10px}
.slot{width:34px;height:34px;border-radius:50%;border:2px solid rgba(232,195,90,.7);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--gold)}
.slot.used{background:var(--gold);color:#6E000B;border-color:var(--gold)}
.left{margin-top:6px;text-align:center;font-size:13px;color:#FFD9DC;font-weight:700}

/* 쿠키 무대 */
.stage{position:relative;height:330px;margin-top:6px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.glow{position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.55),transparent 65%);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.75}}
.cookie{position:relative;width:280px;height:190px;cursor:pointer;transition:transform .15s}
.cookie svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cookie .half{transform-origin:150px 140px;transition:transform .9s cubic-bezier(.2,1.1,.3,1),opacity .9s}
.cookie.broken .hl{transform:translate(-70px,26px) rotate(-32deg)}
.cookie.broken .hr{transform:translate(70px,26px) rotate(32deg)}
.cookie.broken.gone .half{opacity:0}
.cookie.broken .crack{opacity:0;transition:opacity .2s}
.stage{transition:height .6s}
.stage.small{height:200px}
.cookie .crack{stroke:#5A2A06;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke-dashoffset .25s}
.cookie.idle{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-1.5deg)}}
.cookie.shake1{animation:sh1 .35s}
.cookie.shake2{animation:sh2 .4s}
@keyframes sh1{20%{transform:rotate(-4deg) scale(.97)}50%{transform:rotate(4deg) scale(1.02)}80%{transform:rotate(-2deg)}}
@keyframes sh2{15%{transform:rotate(-7deg) scale(.95)}40%{transform:rotate(7deg) scale(1.03)}65%{transform:rotate(-5deg)}85%{transform:rotate(3deg)}}
.hint{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:15px;font-weight:900;color:var(--gold);letter-spacing:.5px;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
.crumb{position:absolute;left:50%;top:50%;width:8px;height:7px;border-radius:40% 60% 50% 45%;background:#E7A84A;pointer-events:none;z-index:5}
.flash{position:absolute;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#FFF6D6,rgba(255,220,140,0));pointer-events:none;animation:flash .6s ease-out forwards;z-index:4}
@keyframes flash{to{transform:scale(9);opacity:0}}

/* 쪽지 */
.slip{position:absolute;left:50%;top:50%;width:250px;margin-left:-125px;height:64px;margin-top:-32px;background:var(--cream);color:#2A2A2A;border-radius:3px;box-shadow:0 8px 20px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-family:'Gowun Batang',serif;font-weight:700;font-size:15px;transform:translateY(30px) scaleX(.05) scaleY(.6);opacity:0;z-index:6;overflow:hidden}
.slip::before,.slip::after{content:"";position:absolute;top:0;bottom:0;width:10px;background:repeating-linear-gradient(180deg,#F1E3C8 0 4px,#FFF8EC 4px 8px)}
.slip::before{left:0}.slip::after{right:0}
.slip.out{animation:slipOut 1.1s cubic-bezier(.2,1.2,.3,1) forwards}
@keyframes slipOut{0%{opacity:1;transform:translateY(20px) scaleX(.05) scaleY(.6)}35%{transform:translateY(-50px) scaleX(.12) scaleY(1)}100%{opacity:1;transform:translateY(-40px) scaleX(1) scaleY(1)}}
.slip span{opacity:0;transition:opacity .4s .8s}
.slip.out span{opacity:1}

/* 운세 카드 */
.result{padding:0 18px;margin-top:-6px;position:relative;z-index:7}
.fcard{position:relative;border-radius:18px;background:var(--cream);color:#2A2A2A;padding:20px 18px 16px;box-shadow:0 16px 40px rgba(0,0,0,.35);overflow:hidden;animation:rise .7s cubic-bezier(.2,1.2,.3,1) both}
@keyframes rise{from{transform:translateY(40px) scale(.9);opacity:0}}
.fcard::before{content:"";position:absolute;inset:7px;border:1.5px solid rgba(230,0,19,.35);border-radius:13px;pointer-events:none}
.fc-top{display:flex;justify-content:space-between;align-items:center}
.fc-top small{font-size:10.5px;font-weight:900;letter-spacing:2px;color:var(--red)}
.fc-top img{height:11px}
.fc-cat{margin-top:10px;display:inline-block;background:var(--red);color:#FFFFFF;font-size:12px;font-weight:900;padding:3px 10px;border-radius:999px}
.fc-text{margin-top:10px;font-family:'Gowun Batang',serif;font-size:20px;line-height:1.55;font-weight:700;color:#1E1E1E}
.fc-lucky{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fc-lucky div{border-radius:10px;background:#FFFFFF;border:1px solid #F1E3C8;padding:8px 4px;text-align:center}
.fc-lucky small{display:block;font-size:10.5px;color:#8A7A60;font-weight:700}
.fc-lucky b{display:block;margin-top:3px;font-size:13px;font-weight:900;color:#2A2A2A;line-height:1.3}
.fc-lucky i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.fc-foot{margin-top:12px;display:flex;justify-content:space-between;font-size:10.5px;color:#8A7A60}
.fc-sheep{position:absolute;right:-8px;top:34px;font-size:64px;opacity:.10;pointer-events:none}
.acts{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:52px;border:0;border-radius:14px;font-size:15.5px;font-weight:900;cursor:pointer}
.btn-save{background:var(--gold);color:#4A0008}
.btn-kakao{background:#FEE500;color:#191919;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-next{grid-column:1 / -1;background:#FFFFFF;color:var(--red)}
.toast{margin-top:8px;text-align:center;font-size:12.5px;color:#FFD9DC;min-height:16px}
.all{padding:0 18px;margin-top:8px;position:relative;z-index:7}
.all h3{margin:0 0 10px;text-align:center;font-family:'Gowun Batang',serif;font-size:22px;color:var(--gold)}
.all .fcard{margin-top:12px;animation-delay:calc(var(--i) * .15s)}
.allwrap{padding:10px;border-radius:22px;background:#7A000E}
.allhead{text-align:center;padding:6px 0 4px;color:#FFFFFF}
.allhead small{font-size:10.5px;letter-spacing:2px;color:var(--gold);font-weight:900}
.allhead b{display:block;font-family:'Gowun Batang',serif;font-size:20px;margin-top:2px}
.done-note{margin-top:12px;text-align:center;font-size:13px;color:#FFD9DC;line-height:1.6}
.foot{margin-top:auto;padding:22px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#FFC9CD;position:relative}
.foot img{height:14px}
</style>
</head>
<body>
<main class="app" id="app">
  <div class="dots"></div>
  <div class="bar" aria-hidden="true"><i></i><i></i></div>
  <div class="head">
    <small>26/27년 경영검토회 · 쉬어가는 코너</small>
    <h1>2027 <em>정미년</em><br>포춘쿠키</h1>
    <p>붉은 양의 해, 쿠키를 <b>톡톡톡</b> 세 번 두드려 깨면<br>나의 2027년 운세가 나옵니다.</p>
    <div class="slots" id="slots"></div>

  </div>

  <div class="stage" id="stage">
    <div class="glow" id="glow"></div>
    <div class="cookie idle" id="cookie" role="button" aria-label="포춘쿠키 두드리기">
      <svg viewBox="0 0 300 200" aria-hidden="true">
        <defs>
          <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD98A"/><stop offset=".55" stop-color="#EBA84A"/><stop offset="1" stop-color="#C77A24"/></linearGradient>
          <radialGradient id="hi" cx=".35" cy=".3" r=".5"><stop offset="0" stop-color="#FFF3CF" stop-opacity=".9"/><stop offset="1" stop-color="#FFF3CF" stop-opacity="0"/></radialGradient>
          <clipPath id="cl"><polygon points="0,0 150,0 150,30 142,55 157,80 143,105 156,128 150,150 150,200 0,200"/></clipPath>
          <clipPath id="cr"><polygon points="300,0 150,0 150,30 142,55 157,80 143,105 156,128 150,150 150,200 300,200"/></clipPath>
          <linearGradient id="pk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C47A28"/><stop offset="1" stop-color="#9A5A16"/></linearGradient>
          <g id="body">
            <path d="M24,132 C22,62 86,26 150,26 C214,26 278,62 276,132 C262,146 236,146 220,132 C200,156 176,166 150,154 C124,166 100,156 80,132 C64,146 38,146 24,132 Z" fill="url(#cg)" stroke="#B36A1E" stroke-width="2.5"/>
            <path d="M66,130 C88,92 118,80 150,82 C182,80 212,92 234,130 C208,118 182,122 150,146 C118,122 92,118 66,130 Z" fill="url(#pk)" opacity=".85"/>
            <path d="M84,124 C104,104 126,98 150,100 C174,98 196,104 216,124" fill="none" stroke="#FFE7B0" stroke-width="2.5" opacity=".55"/>
            <path d="M150,28 C146,50 148,68 150,82" fill="none" stroke="#B36A1E" stroke-width="3" opacity=".75"/>
            <ellipse cx="104" cy="58" rx="50" ry="22" fill="url(#hi)"/>
            <g fill="#C98A3A" opacity=".55"><circle cx="90" cy="70" r="2"/><circle cx="214" cy="66" r="2"/><circle cx="60" cy="100" r="1.6"/><circle cx="244" cy="98" r="1.6"/><circle cx="180" cy="48" r="1.4"/><circle cx="122" cy="44" r="1.4"/></g>
          </g>
        </defs>
        <g class="half hl"><use href="#body" clip-path="url(#cl)"/></g>
        <g class="half hr"><use href="#body" clip-path="url(#cr)"/></g>
        <path class="crack" id="crack" d="M150,28 L142,55 L157,80 L143,105 L156,128 L150,152" stroke-dasharray="140" stroke-dashoffset="140"/>
      </svg>
    </div>
    <div class="slip" id="slip"><span>2027년, 당신에게 온 메시지 ✦</span></div>
    <div class="hint" id="hint">쿠키를 톡! 두드려 주세요</div>
  </div>

  <section class="result" id="result" hidden>
    <div id="card-box"></div>
    <div class="acts">
      <button class="btn btn-save" id="btn-save" type="button">이미지 저장</button>
      <button class="btn btn-kakao" id="btn-kakao" type="button"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3.5C6.8 3.5 2.6 6.8 2.6 10.9c0 2.6 1.7 4.9 4.3 6.2l-.9 3.6c-.1.3.3.6.6.4l4.2-2.8c.4 0 .8.1 1.2.1 5.2 0 9.4-3.3 9.4-7.4S17.2 3.5 12 3.5z" fill="#191919"/></svg>카카오톡 공유</button>
      <button class="btn btn-next" id="btn-next" type="button"></button>
    </div>
    <div class="toast" id="toast"></div>
  </section>

  <section class="all" id="all" hidden>
    <div class="allwrap" id="allwrap"><div class="allhead"><small>MY 2027 FORTUNE</small><b>나의 2027 포춘 모음</b></div><div id="all-list"></div></div>
    <div class="acts">
      <button class="btn btn-save" id="btn-save-all" type="button">3장 한 번에 저장</button>
      <button class="btn btn-kakao" id="btn-kakao-all" type="button"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3.5C6.8 3.5 2.6 6.8 2.6 10.9c0 2.6 1.7 4.9 4.3 6.2l-.9 3.6c-.1.3.3.6.6.4l4.2-2.8c.4 0 .8.1 1.2.1 5.2 0 9.4-3.3 9.4-7.4S17.2 3.5 12 3.5z" fill="#191919"/></svg>카카오톡 공유</button>
    </div>
    <div class="toast" id="toast-all"></div>
    <div class="done-note">쿠키 3개를 모두 받았어요. 2027년, 이 중 하나는 꼭 이뤄질 거예요!</div>
  </section>

  <div class="foot"><span>26/27년 경영검토회</span><img src="__LOGOW__" alt="SANGSIN BRAKE"></div>
</main>

<script>/*__H2C__*/</script>
<script>
(function(){
  var CONFIG = { MAX: 3, KEY: "sangsin_fortune_2027", SHARE_URL: "https://imsean629.github.io/sangsin-leader-2027/fortune/" };
  var FORTUNES = /*__FORTUNES__*/null, ITEMS = /*__ITEMS__*/null, COLORS = /*__COLORS__*/null;
  var CAT = { '일': '일·커리어운', '관계': '관계운', '건강': '건강운', '생활': '생활운' };
  var $ = function(id){ return document.getElementById(id); };
  function el(t, c, x){ var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function load(){ try { var s = JSON.parse(localStorage.getItem(CONFIG.KEY) || 'null'); if (s && s.v === 1) return s; } catch (e) {} return { v: 1, got: [] }; }
  function save(){ try { localStorage.setItem(CONFIG.KEY, JSON.stringify(ST)); } catch (e) {} }
  var ST = load(), taps = 0, busy = false, cur = null, lastPng = null, capGen = 0;

  function draw(){
    var used = ST.got.map(function(g){ return g.f; }), pool = [];
    FORTUNES.forEach(function(_, i){ if (used.indexOf(i) < 0) pool.push(i); });
    var f = pool[Math.floor(Math.random() * pool.length)];
    var usedCat = ST.got.map(function(g){ return FORTUNES[g.f][0]; }); // 가능하면 다른 분야로
    var alt = pool.filter(function(i){ return usedCat.indexOf(FORTUNES[i][0]) < 0; }); if (alt.length) f = alt[Math.floor(Math.random() * alt.length)];
    function pick(n, key){ var u = ST.got.map(function(g){ return g[key]; }), c; do { c = Math.floor(Math.random() * n); } while (u.indexOf(c) >= 0); return c; }
    return { f: f, item: pick(ITEMS.length, 'item'), color: pick(COLORS.length, 'color'), num: pick(99, 'num') + 1, at: Date.now() };
  }
  function renderSlots(){
    var s = $('slots'); s.innerHTML = '';
    for (var i = 0; i < CONFIG.MAX; i++) s.appendChild(el('div', 'slot' + (i < ST.got.length ? ' used' : ''), i < ST.got.length ? '✓' : String(i + 1)));
    var left = CONFIG.MAX - ST.got.length;
    $('left').textContent = left > 0 ? '받을 수 있는 쿠키 ' + left + '개 남음' : '쿠키 3개를 모두 받았어요';
  }
  function cardEl(g, i){
    var F = FORTUNES[g.f], C = COLORS[g.color];
    var c = el('div', 'fcard'); if (i != null) c.style.setProperty('--i', i);
    var top = el('div', 'fc-top'); top.appendChild(el('small', null, '2027 FORTUNE · ' + (i != null ? (i + 1) + '/3' : ST.got.length + '/3')));
    var lg = new Image(); lg.src = '__LOGO__'; lg.alt = 'SANGSIN BRAKE'; top.appendChild(lg); c.appendChild(top);
    c.appendChild(el('div', 'fc-sheep', '🐑'));
    c.appendChild(el('span', 'fc-cat', CAT[F[0]]));
    c.appendChild(el('div', 'fc-text', F[1]));
    var lk = el('div', 'fc-lucky');
    var d1 = el('div'); d1.appendChild(el('small', null, '행운의 아이템')); d1.appendChild(el('b', null, ITEMS[g.item])); lk.appendChild(d1);
    var d2 = el('div'); d2.appendChild(el('small', null, '행운의 컬러')); var b2 = el('b'); var dot = el('i'); dot.style.background = C[1]; b2.appendChild(dot); b2.appendChild(document.createTextNode(C[0])); d2.appendChild(b2); lk.appendChild(d2);
    var d3 = el('div'); d3.appendChild(el('small', null, '행운의 숫자')); d3.appendChild(el('b', null, String(g.num))); lk.appendChild(d3);
    c.appendChild(lk);
    var ft = el('div', 'fc-foot'); ft.appendChild(el('span', null, '26/27년 경영검토회 · 정미년 붉은 양의 해')); ft.appendChild(el('span', null, '동주공제')); c.appendChild(ft);
    return c;
  }

  // ===== 깨기 모션 =====
  function crumbs(n, power){
    var st = $('stage');
    for (var i = 0; i < n; i++) {
      var c = el('div', 'crumb'); var s = 4 + Math.random() * 7; c.style.width = s + 'px'; c.style.height = s * .8 + 'px';
      c.style.background = ['#E7A84A', '#F5C46B', '#C77A24', '#FFD98A'][i % 4]; st.appendChild(c);
      var a = Math.random() * Math.PI * 2, d = (40 + Math.random() * 90) * power, dx = Math.cos(a) * d, dy = Math.sin(a) * d * .7 - 30 * power;
      c.animate([{ transform: 'translate(-50%,-50%) rotate(0deg)', opacity: 1 }, { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) rotate(' + (Math.random() * 540) + 'deg)', opacity: 1, offset: .6 }, { transform: 'translate(calc(-50% + ' + dx * 1.1 + 'px), calc(-50% + ' + (dy + 120) + 'px)) rotate(' + (Math.random() * 720) + 'deg)', opacity: 0 }], { duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' });
      setTimeout(function(x){ return function(){ x.remove(); }; }(c), 1600);
    }
  }
  function buzz(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
  function tap(){
    if (busy || ST.got.length >= CONFIG.MAX) return;
    taps++; var ck = $('cookie'), crack = $('crack');
    ck.classList.remove('idle', 'shake1', 'shake2'); void ck.offsetWidth;
    if (taps === 1) { ck.classList.add('shake1'); crack.style.strokeDashoffset = '95'; crumbs(6, .6); buzz(20); $('hint').textContent = '금이 갔어요! 한 번 더 톡!'; }
    else if (taps === 2) { ck.classList.add('shake2'); crack.style.strokeDashoffset = '40'; crumbs(10, .8); buzz(35); $('hint').textContent = '거의 다 됐어요! 마지막으로 톡!'; }
    else { busy = true; crack.style.strokeDashoffset = '0'; buzz([30, 40, 60]); setTimeout(breakOpen, 180); }
  }
  function breakOpen(){
    var ck = $('cookie'), st = $('stage');
    var fl = el('div', 'flash'); st.appendChild(fl); setTimeout(function(){ fl.remove(); }, 700);
    ck.classList.add('broken'); crumbs(26, 1.25); $('hint').textContent = ''; $('glow').style.opacity = '.4';
    cur = draw(); ST.got.push(cur); save(); renderSlots();
    setTimeout(function(){ $('slip').classList.add('out'); }, 350);
    setTimeout(function(){ ck.classList.add('gone'); $('stage').classList.add('small'); showResult(); }, 1700);
  }
  function showResult(){
    var box = $('card-box'); box.innerHTML = ''; box.appendChild(cardEl(cur));
    var left = CONFIG.MAX - ST.got.length;
    $('btn-next').textContent = left > 0 ? '🥠 다음 쿠키 깨기 (' + left + '개 남음)' : '🎁 나의 2027 포춘 3장 모아 보기';
    $('result').hidden = false; $('toast').textContent = ''; lastPng = null; capGen++;
    setTimeout(function(){ $('result').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 200);
    setTimeout(function(){ capture($('card-box').firstChild).catch(function(){}); }, 900);
  }
  function resetCookie(){
    taps = 0; busy = false; var ck = $('cookie');
    ck.className = 'cookie idle'; $('crack').style.strokeDashoffset = '140'; $('stage').classList.remove('small');
    $('slip').classList.remove('out'); $('glow').style.opacity = ''; $('hint').textContent = '쿠키를 톡! 두드려 주세요';
    $('result').hidden = true; window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function showAll(){
    $('stage').hidden = true; $('result').hidden = true;
    var list = $('all-list'); list.innerHTML = ''; ST.got.forEach(function(g, i){ list.appendChild(cardEl(g, i)); });
    $('all').hidden = false; lastPng = null; capGen++;
    setTimeout(function(){ capture($('allwrap')).catch(function(){}); }, 1200);
  }
  $('cookie').addEventListener('pointerdown', function(e){ e.preventDefault(); tap(); });
  $('btn-next').addEventListener('click', function(){ if (ST.got.length >= CONFIG.MAX) showAll(); else resetCookie(); });

  // ===== 이미지 저장 / 공유 =====
  function capture(node){
    if (lastPng && lastPng.node === node) return Promise.resolve(lastPng);
    var g = capGen; if (!window.html2canvas) return Promise.reject(new Error('no-h2c'));
    return window.html2canvas(node, { scale: 3, backgroundColor: null, logging: false }).then(function(cv){
      return new Promise(function(res){ cv.toBlob(function(b){ var p = { node: node, blob: b, url: URL.createObjectURL(b) }; if (g === capGen) lastPng = p; res(p); }, 'image/png'); });
    });
  }
  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function saveNow(p, name, toastEl){
    var file = null; try { file = new File([p.blob], name, { type: 'image/png' }); } catch (e) {}
    if (isIOS && file && navigator.canShare && navigator.canShare({ files: [file] })) return navigator.share({ files: [file], title: '2027 포춘쿠키' }).then(function(){ toastEl.textContent = '포춘 카드를 저장했어요.'; }, function(){});
    var a = document.createElement('a'); a.href = p.url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    toastEl.textContent = '포춘 카드를 저장했어요. 사진첩 또는 다운로드 폴더를 확인하세요.';
  }
  function bindSave(btnId, nodeFn, nameFn, toastId){
    $(btnId).addEventListener('click', function(){
      var b = this, lbl = b.textContent, node = nodeFn();
      if (lastPng && lastPng.node === node) { saveNow(lastPng, nameFn(), $(toastId)); return; }
      b.disabled = true; b.textContent = '이미지 만드는 중…';
      capture(node).then(function(p){ saveNow(p, nameFn(), $(toastId)); }).catch(function(){ $(toastId).textContent = '이미지를 만들지 못했어요. 화면을 캡처해 주세요.'; }).then(function(){ b.disabled = false; b.textContent = lbl; });
    });
  }
  bindSave('btn-save', function(){ return $('card-box').firstChild; }, function(){ return '2027포춘쿠키_' + ST.got.length + '.png'; }, 'toast');
  bindSave('btn-save-all', function(){ return $('allwrap'); }, function(){ return '2027포춘쿠키_3장.png'; }, 'toast-all');
  function share(text, node, toastEl){
    var p = lastPng && lastPng.node === node ? lastPng : null;
    if (navigator.share) {
      var data = { title: '2027 포춘쿠키', text: text };
      var file = null; try { if (p) file = new File([p.blob], '2027포춘쿠키.png', { type: 'image/png' }); } catch (e) {}
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) data.files = [file]; else data.url = CONFIG.SHARE_URL;
      navigator.share(data).then(function(){ toastEl.textContent = '공유했어요.'; }, function(e){ if (e && e.name === 'AbortError') return; if (data.files) { delete data.files; data.url = CONFIG.SHARE_URL; navigator.share(data).catch(function(){}); } });
      return;
    }
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function(){ toastEl.textContent = '공유 문구를 복사했어요. 카카오톡 대화창에 붙여넣어 주세요.'; }, function(){ toastEl.textContent = '공유 링크: ' + CONFIG.SHARE_URL; });
  }
  $('btn-kakao').addEventListener('click', function(){ share('[26/27년 경영검토회] 나의 2027 포춘쿠키: “' + FORTUNES[cur.f][1] + '” 너도 깨 봐 → ' + CONFIG.SHARE_URL, $('card-box').firstChild, $('toast')); });
  $('btn-kakao-all').addEventListener('click', function(){ share('[26/27년 경영검토회] 2027 포춘쿠키 3개 다 깼다! 너도 3개까지 받을 수 있어 → ' + CONFIG.SHARE_URL, $('allwrap'), $('toast-all')); });

  // ===== 시작 =====
  renderSlots();
  if (ST.got.length >= CONFIG.MAX) showAll();
  window.__FC = { state: function(){ return ST; }, tap: tap };
})();
</script>
</body>
